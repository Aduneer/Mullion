[package]
name = "oriel"
version = "0.5.0"
description = "A second-screen command center for Windows"
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
mullion-core = { workspace = true, features = ["audio", "media", "net", "pdh"] }
tauri = { workspace = true, features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
nvml-wrapper = "0.13"
windows = { workspace = true, features = [
    "Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_System_Com", "Globalization",
] }
base64 = { workspace = true }
