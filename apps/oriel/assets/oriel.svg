<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Oriel</title>
  <!-- Verdigris: weathered copper, as on an old bay window's roof. -->
  <rect width="1024" height="1024" rx="224" fill="#2e6e60"/>
  <!-- an oriel: a bay window standing out from the wall, three panes under a roof, on a corbel -->
  <g fill="#f0efec">
    <polygon points="232,292 336,212 688,212 792,292"/>
    <polygon points="262,330 386,306 386,640 262,616" fill-opacity="0.62"/>
    <rect x="410" y="306" width="204" height="334" rx="10"/>
    <polygon points="762,330 638,306 638,640 762,616" fill-opacity="0.62"/>
    <rect x="242" y="664" width="540" height="40" rx="14"/>
    <polygon points="392,724 632,724 512,820"/>
  </g>
</svg>
