<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 640" width="700" height="640">
  <title>Mullion's window at dusk</title>
  <!-- The picture in the repo's social preview: the logo's window, two panes and the mullion
       between them on a sill, with an evening outside. It names no app, so it stays right as apps
       are added. -->
  <defs>
    <!-- The evening's light on the wall around the window. -->
    <radialGradient id="spill" cx="360" cy="430" r="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e0905a" stop-opacity="0.2"/>
      <stop offset="0.55" stop-color="#e0905a" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#e0905a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="124" x2="0" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0e1430"/>
      <stop offset="0.36" stop-color="#222a59"/>
      <stop offset="0.62" stop-color="#5b4a7e"/>
      <stop offset="0.82" stop-color="#c3775c"/>
      <stop offset="1" stop-color="#eda964"/>
    </linearGradient>
    <radialGradient id="sun" cx="440" cy="468" r="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe0a8" stop-opacity="0.75"/>
      <stop offset="0.35" stop-color="#f6b46e" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#f6b46e" stop-opacity="0"/>
    </radialGradient>
    <!-- A soft band of reflection across both panes. -->
    <linearGradient id="sheen" x1="204" y1="520" x2="516" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0.3" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#fff" stop-opacity="0.07"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.02"/>
      <stop offset="0.56" stop-color="#fff" stop-opacity="0.06"/>
      <stop offset="0.66" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <!-- The frame's depth: a little shadow just inside it, on the glass. -->
    <linearGradient id="inset" x1="0" y1="124" x2="0" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="90" x2="0" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f2efe9"/>
      <stop offset="1" stop-color="#d9d4ca"/>
    </linearGradient>
    <linearGradient id="sill" x1="0" y1="516" x2="0" y2="556" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4f1eb"/>
      <stop offset="0.3" stop-color="#e4dfd6"/>
      <stop offset="1" stop-color="#c9c3b7"/>
    </linearGradient>
    <radialGradient id="shadow" cx="360" cy="566" r="250" gradientTransform="matrix(1 0 0 0.09 0 515)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="glass">
      <rect x="204" y="124" width="141" height="396"/>
      <rect x="375" y="124" width="141" height="396"/>
    </clipPath>
  </defs>

  <rect width="700" height="640" fill="url(#spill)"/>
  <ellipse cx="360" cy="566" rx="260" ry="26" fill="url(#shadow)"/>

  <!-- Outside. -->
  <g clip-path="url(#glass)">
    <rect x="200" y="120" width="320" height="404" fill="url(#sky)"/>
    <circle cx="250" cy="168" r="1.3" fill="#f0efec" opacity="0.7"/>
    <circle cx="452" cy="150" r="1.6" fill="#f0efec" opacity="0.8"/>
    <circle cx="492" cy="214" r="1.1" fill="#f0efec" opacity="0.5"/>
    <circle cx="300" cy="246" r="1" fill="#f0efec" opacity="0.4"/>
    <rect x="200" y="300" width="320" height="224" fill="url(#sun)"/>
    <circle cx="440" cy="474" r="22" fill="#ffe6b8"/>
    <path d="M200 472c40-12 84-18 128-12s76 14 118 8 52-14 74-14v80H200z" fill="#7a5672" opacity="0.7"/>
    <path d="M200 490c56-16 104-14 150-4s92 8 130-4 30-8 40-6v48H200z" fill="#3a2b47"/>
    <path d="M200 506c70-10 140-8 200 0s96 2 120-4v26H200z" fill="#1b1525"/>
    <rect x="200" y="120" width="320" height="404" fill="url(#sheen)"/>
    <rect x="200" y="124" width="320" height="26" fill="url(#inset)"/>
  </g>

  <!-- The frame, the mullion and the sill. -->
  <path d="M210 90h300a40 40 0 0 1 40 40v390h-34V124H204v396h-34V130a40 40 0 0 1 40-40z" fill="url(#wood)"/>
  <rect x="345" y="104" width="30" height="416" fill="url(#wood)"/>
  <path d="M210 90h300a40 40 0 0 1 40 40" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="1.5"/>
  <g fill="none" stroke="#000" stroke-opacity="0.28" stroke-width="1.5">
    <rect x="204.75" y="124.75" width="139.5" height="395"/>
    <rect x="375.75" y="124.75" width="139.5" height="395"/>
  </g>
  <rect x="140" y="516" width="440" height="40" rx="10" fill="url(#sill)"/>
  <rect x="150" y="516.5" width="420" height="2" rx="1" fill="#fff" opacity="0.6"/>
  <!-- The last of the sun, across the sill. -->
  <path d="M392 516h66l40 40h-70z" fill="#f2a865" opacity="0.18"/>
</svg>
