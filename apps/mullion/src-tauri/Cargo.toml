[package]
name = "mullion"
version = "0.4.1"
description = "Mullion: one tray icon, sign-in entry and settings window for the suite's apps"
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
mullion-core = { workspace = true, features = ["net"] }
base64 = { workspace = true }
tauri = { workspace = true, features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The update's installer is checked against its release's SHA256SUMS.txt. Tauri already uses it.
sha2 = "0.10"
