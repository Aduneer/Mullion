<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sill preview</title>
  <style>
    /* A stand-in screen: a made-up wallpaper, a window, and the dock along an edge (host.js).
       With ?float=1 Windows' taskbar stays, and the dock floats above it. */
    html, body { margin: 0; height: 100%; overflow: hidden; font: 13px "Segoe UI", system-ui, sans-serif; }
    body { background: var(--wallpaper) center / cover, #27375a; }
    #dock { position: absolute; border: 0; display: block; background: transparent; color-scheme: dark; }
    body.light #dock { color-scheme: light; }
    #taskbar {
      position: absolute; left: 0; right: 0; bottom: 0; height: 48px; display: none; justify-content: center; align-items: center; gap: 6px;
      background: rgba(28, 28, 30, .86); border-top: 1px solid rgba(255,255,255,.08);
    }
    body.float #taskbar { display: flex; }
    #taskbar span { width: 24px; height: 24px; margin: 6px; border-radius: 7px; background: rgba(255,255,255,.25); }
    .window {
      position: absolute; left: 22%; top: 9%; width: 56%; height: 62%; border-radius: 8px; overflow: hidden;
      background: #f9f9f9; box-shadow: 0 0 0 1px rgba(0,0,0,.12), 0 16px 48px rgba(0,0,0,.35);
    }
    .window .caption { height: 32px; display: flex; align-items: center; padding: 0 12px; background: #eee; font-size: 12px; color: #333; }
    .window .body { padding: 18px; display: grid; gap: 10px; }
    .line { height: 10px; border-radius: 5px; background: #e2e2e2; }
    .block { height: 150px; border-radius: 8px; background: linear-gradient(135deg, #ffb36b, #e0577a); }
    #log {
      position: absolute; right: 12px; top: 12px; max-width: 420px; padding: 8px 10px; border-radius: 8px;
      background: rgba(0,0,0,.45); color: #fff; font: 12px/1.4 ui-monospace, Consolas, monospace; white-space: pre-wrap;
    }
    #log:empty { display: none; }
  </style>
</head>
<body>
  <div class="window"><div class="caption">Weekend away - Notes</div><div class="body">
    <div class="line" style="width:58%"></div><div class="line" style="width:86%"></div><div class="block"></div><div class="line" style="width:40%"></div>
  </div></div>
  <div id="taskbar"><span></span><span></span><span></span><span></span></div>
  <iframe id="dock" title="dock"></iframe>
  <div id="log"></div>
  <script src="host.js"></script>
</body>
</html>
