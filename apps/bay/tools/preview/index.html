<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bay preview</title>
  <style>
    /* A stand-in screen: a made-up wallpaper and windows, a taskbar, and Bay's overview page over
       the rest (the work area). What DWM does in the real app, the harness does here: it draws a
       copy of each window (#thumbs) over the page, where the page says its thumbnail goes, and
       one of the desktop under them that fades as they fly. */
    html, body { margin: 0; height: 100%; overflow: hidden; font: 13px "Segoe UI", system-ui, sans-serif; }
    #desktop { position: absolute; inset: 0 0 48px 0; background: var(--wallpaper) center / cover, #27375a; overflow: hidden; }
    #taskbar {
      position: absolute; left: 0; right: 0; bottom: 0; height: 48px; display: flex; justify-content: center; align-items: center; gap: 6px;
      background: rgba(28, 28, 30, .86); border-top: 1px solid rgba(255,255,255,.08);
    }
    #taskbar img { width: 24px; height: 24px; padding: 6px; border-radius: 6px; }
    #taskbar img:first-child { background: rgba(255,255,255,.08); }
    #overview { position: absolute; inset: 0 0 48px 0; visibility: hidden; }
    #overview.on { visibility: visible; }
    #page { display: block; width: 100%; height: 100%; border: 0; }
    /* Under each copy and the desktop's: no input, as with DWM's thumbnails. */
    #thumbs { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    #thumbs > * { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
    #thumbs .desk { width: 100%; height: 100%; background: var(--wallpaper) center / cover; }

    /* The made-up windows, as Windows 11 draws them. */
    .window {
      position: absolute; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column;
      background: #f9f9f9; color: #222; box-shadow: 0 0 0 1px rgba(0,0,0,.12), 0 16px 48px rgba(0,0,0,.35);
    }
    .window.dark { background: #202020; color: #ddd; }
    .window .caption { height: 32px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 0 0 12px; background: #eee; font-size: 12px; }
    .window.dark .caption { background: #2b2b2b; }
    .window .caption img { width: 16px; height: 16px; }
    .window .caption span:last-child { margin-left: auto; letter-spacing: 26px; color: #888; }
    .window .body { flex: 1; position: relative; padding: 18px; display: grid; gap: 10px; align-content: start; }
    .line { height: 10px; border-radius: 5px; background: #e2e2e2; }
    .dark .line { background: #3a3a3a; }
    .block { border-radius: 8px; }
    .mono { font: 12px/1.6 Consolas, monospace; white-space: pre; }

    #log {
      position: absolute; right: 12px; top: 12px; max-width: 420px; padding: 8px 10px; border-radius: 8px;
      background: rgba(0,0,0,.6); color: #fff; font: 12px/1.4 ui-monospace, Consolas, monospace; white-space: pre-wrap; z-index: 9;
    }
    #log:empty { display: none; }
  </style>
</head>
<body>
  <div id="desktop"></div>
  <div id="taskbar"></div>
  <div id="overview"><iframe id="page" title="Bay"></iframe><div id="thumbs"></div></div>
  <div id="log"></div>
  <script src="host.js"></script>
</body>
</html>
