<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sash preview</title>
  <style>
    /* A stand-in screen: a made-up wallpaper and windows, and a taskbar. Click a window to bring it
       to the front, then press Ctrl+Alt and an arrow, Enter, Space or Backspace: the harness moves
       it as Sash would (host.js). */
    html, body { margin: 0; height: 100%; overflow: hidden; font: 13px "Segoe UI", system-ui, sans-serif; }
    #desktop { position: absolute; inset: 0 0 48px 0; background: var(--wallpaper) center / cover, #27375a; overflow: hidden; }
    #taskbar {
      position: absolute; left: 0; right: 0; bottom: 0; height: 48px; display: flex; justify-content: center; align-items: center; gap: 6px;
      background: rgba(28, 28, 30, .86); border-top: 1px solid rgba(255,255,255,.08);
    }
    #taskbar img { width: 24px; height: 24px; padding: 6px; border-radius: 6px; }
    #taskbar img.front { background: rgba(255,255,255,.08); }

    /* The made-up windows, as Windows 11 draws them. */
    .window {
      position: absolute; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column;
      background: #f9f9f9; color: #222; box-shadow: 0 0 0 1px rgba(0,0,0,.12), 0 16px 48px rgba(0,0,0,.35);
    }
    .window.zoomed { border-radius: 0; }
    .window.dark { background: #202020; color: #ddd; }
    .window .caption { height: 32px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 0 0 12px; background: #eee; font-size: 12px; white-space: nowrap; overflow: hidden; }
    .window.dark .caption { background: #2b2b2b; }
    .window .caption img { width: 16px; height: 16px; }
    .window .caption span:last-child { margin-left: auto; letter-spacing: 26px; color: #888; }
    .window .body { flex: 1; position: relative; padding: 18px; display: grid; gap: 10px; align-content: start; overflow: hidden; }
    .line { height: 10px; border-radius: 5px; background: #e2e2e2; }
    .dark .line { background: #3a3a3a; }
    .block { border-radius: 8px; }
    .mono { font: 12px/1.6 Consolas, monospace; white-space: pre; }

    /* The keys just pressed, as a demo shows them. */
    #keys {
      position: absolute; left: 50%; bottom: 140px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center;
      padding: 12px 16px; border-radius: 16px; background: rgba(20,20,22,.78); color: #f0efec; font: 600 20px "Segoe UI Variable Display", "Segoe UI", sans-serif;
      box-shadow: 0 12px 40px rgba(0,0,0,.35); z-index: 99;
    }
    #keys:empty { display: none; }
    #keys kbd { font: inherit; min-width: 26px; text-align: center; padding: 6px 12px; border-radius: 9px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.16); }

    /* Sash's note: the real page, in a frame its own size. */
    #note { position: absolute; width: 640px; height: 80px; left: 50%; transform: translateX(-50%); bottom: 80px; border: 0; border-radius: 8px; visibility: hidden; z-index: 100;
      box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 12px 40px rgba(0,0,0,.4); }
  </style>
</head>
<body>
  <div id="desktop"></div>
  <div id="taskbar"></div>
  <div id="keys"></div>
  <iframe id="note" title="Sash's note"></iframe>
  <script src="host.js"></script>
</body>
</html>
