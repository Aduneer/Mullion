<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Sash</title>
  <!-- Plum, a heritage paint for the frames of old sash windows. -->
  <rect width="1024" height="1024" rx="224" fill="#6b4c8a"/>
  <!-- sashes: panes that slide into place, meeting exactly; the left one just snapped there -->
  <g fill="#f0efec">
    <rect x="200" y="216" width="304" height="592" rx="28"/>
    <rect x="520" y="216" width="304" height="288" rx="28" fill-opacity="0.62"/>
    <rect x="520" y="520" width="304" height="288" rx="28" fill-opacity="0.36"/>
  </g>
  <path d="M396 420 L304 512 L396 604" fill="none" stroke="#6b4c8a" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
