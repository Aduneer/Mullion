<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Mitre</title>
  <!-- Oak, the timber of a joiner's frame, whose corners meet in a mitre. -->
  <rect width="1024" height="1024" rx="224" fill="#8b5e34"/>
  <defs>
    <clipPath id="inside"><rect x="204" y="252" width="616" height="480" rx="18"/></clipPath>
  </defs>
  <!-- a screen whose top-left corner glows: the pointer pushed into it -->
  <g clip-path="url(#inside)" fill="#f0efec">
    <circle cx="204" cy="252" r="330" fill-opacity="0.16"/>
    <circle cx="204" cy="252" r="230" fill-opacity="0.32"/>
    <circle cx="204" cy="252" r="136" fill-opacity="0.7"/>
  </g>
  <rect x="184" y="232" width="656" height="520" rx="38" fill="none" stroke="#f0efec" stroke-width="40"/>
  <path d="M476 476 L476 700 L532 646 L576 740 L622 720 L578 628 L656 628 Z" fill="#f0efec" stroke="#8b5e34" stroke-width="22" stroke-linejoin="round"/>
</svg>
