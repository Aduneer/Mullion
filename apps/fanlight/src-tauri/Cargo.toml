[package]
name = "fanlight"
version = "0.4.0"
description = "A Spotlight-style search for Windows"
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
mullion-core = { workspace = true }
tauri = { workspace = true, features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant",
    "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_Graphics_Gdi",
] }
