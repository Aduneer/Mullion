<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Fanlight</title>
  <!-- Ochre, the lamplight a fanlight lets into a hall. -->
  <rect width="1024" height="1024" rx="224" fill="#dd9d2c"/>
  <!-- a fanlight: the half-wheel of glass over a door, its spokes running out from the hub -->
  <path d="M232 556a280 280 0 0 1 560 0z" fill="#1c1b19"/>
  <g stroke="#dd9d2c" stroke-width="20" stroke-linecap="round">
    <path d="M512 556V286M512 556L321 365M512 556L703 365M512 556L248 556M512 556L776 556"/>
  </g>
  <circle cx="512" cy="556" r="62" fill="#dd9d2c"/>
  <circle cx="512" cy="556" r="34" fill="#1c1b19"/>
  <!-- and under it, where the door would be, the search field it lights -->
  <rect x="200" y="620" width="624" height="120" rx="60" fill="#1c1b19"/>
  <g fill="none" stroke="#dd9d2c" stroke-width="18" stroke-linecap="round">
    <circle cx="284" cy="676" r="26"/>
    <path d="M304 696l22 22"/>
  </g>
  <g fill="#dd9d2c">
    <rect x="364" y="670" width="190" height="20" rx="10" opacity="0.9"/>
    <rect x="574" y="670" width="90" height="20" rx="10" opacity="0.45"/>
  </g>
</svg>
