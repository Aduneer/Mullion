name: Bug report
description: Something in Fanlight doesn't work, or works wrongly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. A quick search of the existing issues first saves us both a step.
        For a security problem, please use **Security → Report a vulnerability** instead, so it stays private.

  - type: input
    id: version
    attributes:
      label: Fanlight version
      description: At the bottom of Fanlight's settings (Ctrl+, in the panel).
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How you run it
      options:
        - Installer (setup.exe)
        - Portable zip
        - Built from source
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Settings → System → About, under Windows specifications.
      placeholder: "Windows 11 24H2"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: The steps, if you know them. "It happens after a few hours" helps too.

  - type: textarea
    id: extra
    attributes:
      label: Screenshots, hardware, anything else
      description: |
        Your screens and their scaling (100%, 150%…) help with layout problems; for a missing file, where it is and its name.
        Before you attach a screenshot, check it doesn't show anything private: file names, window titles, what you copied.
