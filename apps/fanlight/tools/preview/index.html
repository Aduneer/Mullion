<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fanlight preview</title>
  <style>
    /* A stand-in desktop: a made-up wallpaper, an app window, and Fanlight's panel over them. */
    html, body { margin: 0; height: 100%; overflow: hidden; font: 13px "Segoe UI", system-ui, sans-serif; }
    body { background: var(--wallpaper) center / cover, #27375a; }
    /* A stand-in app window, as Windows 11 draws one, so the glass has something behind it. */
    .window {
      position: absolute; left: 9%; top: 7%; width: 64%; height: 78%; border-radius: 8px; background: #f9f9f9;
      box-shadow: 0 16px 48px rgba(0,0,0,.4); overflow: hidden; display: flex; flex-direction: column;
    }
    body.dark .window { background: #202020; }
    .window .caption { height: 34px; flex: none; display: flex; align-items: center; justify-content: space-between; padding-left: 14px; background: #eeeeee; color: #333; font-size: 12px; }
    body.dark .window .caption { background: #2b2b2b; color: #ddd; }
    .window .caption span:last-child { letter-spacing: 26px; color: #777; }
    .window .body { flex: 1; padding: 26px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-content: start; }
    .window .line { grid-column: 1 / -1; height: 11px; border-radius: 6px; background: #e4e4e4; }
    body.dark .window .line { background: #3a3a3a; }
    .window .card { height: 150px; border-radius: 10px; }
    /* The panel's window: as tall and wide as the page says (fit), rounded and shadowed as
       Windows draws it, and with glass, what's behind it blurred, as acrylic does. */
    #win {
      position: absolute; left: 50%; border-radius: 8px; overflow: hidden; visibility: hidden;
      box-shadow: 0 0 0 1px rgba(0,0,0,.18), 0 24px 70px rgba(0,0,0,.45), 0 4px 14px rgba(0,0,0,.25);
    }
    #win.on { visibility: visible; }
    body.glass #win { backdrop-filter: blur(36px) saturate(1.5); -webkit-backdrop-filter: blur(36px) saturate(1.5); }
    body.glass.dark #win { background: rgba(32, 32, 36, .38); }
    body.glass:not(.dark) #win { background: rgba(243, 243, 243, .45); }
    /* Its color-scheme matches the page's, or Chromium paints the frame opaque. */
    #panel { display: block; width: 100%; height: 100%; border: 0; background: transparent; color-scheme: dark; }
    body:not(.dark) #panel { color-scheme: light; }
    #log {
      position: absolute; right: 12px; bottom: 12px; max-width: 420px; padding: 8px 10px; border-radius: 8px;
      background: rgba(0,0,0,.45); color: #fff; font: 12px/1.4 ui-monospace, Consolas, monospace; white-space: pre-wrap;
    }
    #log:empty { display: none; }
  </style>
</head>
<body>
  <div class="window">
    <div class="caption"><span>Weekend away - Notes</span><span>–□✕</span></div>
    <div class="body">
      <div class="line" style="width:58%"></div><div class="line" style="width:86%"></div><div class="line" style="width:72%"></div>
      <div class="card" style="background:linear-gradient(135deg,#ffb36b,#e0577a)"></div><div class="card" style="background:linear-gradient(135deg,#5fc8ff,#3d63d8)"></div>
      <div class="line" style="width:64%"></div><div class="line" style="width:40%"></div>
    </div>
  </div>
  <div id="win"><iframe id="panel" title="Fanlight"></iframe></div>
  <div id="log"></div>
  <script src="host.js"></script>
</body>
</html>
