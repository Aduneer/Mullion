<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lintel preview</title>
  <style>
    /* A stand-in desktop: the bar along the top, the menu window along it. */
    html, body { margin: 0; height: 100%; overflow: hidden; font: 13px "Segoe UI", system-ui, sans-serif; }
    body { background: linear-gradient(160deg, #3b5f8f, #27375a 55%, #1c2238); }
    body.light { background: linear-gradient(160deg, #c9daf0, #a8bfdf 55%, #8ea6cc); }
    /* With ?glass=on the made-up wallpaper (host.js) is the desktop, as the bar's glass shows it. */
    body.glass { background: var(--wallpaper) center / cover; }
    #bar { position: absolute; left: 0; top: 0; width: 100%; border: 0; display: block; }
    /* The menu window: see-through, along the bar (host.js); the page draws the menu in it. Its
       color-scheme matches the page's, or Chromium paints the frame opaque. */
    /* Hidden, not undisplayed: like a hidden window, it still lays its page out at its size. */
    #menu { position: absolute; border: 0; visibility: hidden; background: transparent; color-scheme: dark; }
    body.light #menu { color-scheme: light; }
    /* The stand-in pointer for ?demo=1. */
    #pointer { position: absolute; left: 62%; top: 46%; width: 14px; height: 21px; opacity: 0; pointer-events: none; z-index: 2;
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1), top 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s; }
    #pointer.on { opacity: 1; }
    #log {
      position: absolute; right: 12px; bottom: 12px; max-width: 420px; padding: 8px 10px; border-radius: 8px;
      background: rgba(0,0,0,.45); color: #fff; font: 12px/1.4 ui-monospace, Consolas, monospace; white-space: pre-wrap;
    }
    #log:empty { display: none; }
    /* A stand-in app window, as Windows 11 draws one. */
    .window {
      position: absolute; left: 30%; top: 18%; width: 52%; height: 56%; border-radius: 8px; background: #f9f9f9;
      box-shadow: 0 16px 48px rgba(0,0,0,.4); overflow: hidden; display: flex; flex-direction: column;
    }
    .window .caption { height: 34px; flex: none; display: flex; align-items: center; justify-content: space-between; padding-left: 14px; background: #eeeeee; color: #333; font-size: 12px; }
    .window .caption span:last-child { letter-spacing: 26px; color: #555; }
    .window .body { flex: 1; padding: 22px; display: grid; gap: 12px; align-content: start; }
    .window .line { height: 10px; border-radius: 5px; background: #e4e4e4; }
  </style>
</head>
<body>
  <div class="window">
    <div class="caption"><span>Aduneer/Lintel - Google Chrome</span><span>–□✕</span></div>
    <div class="body"><div class="line" style="width:62%"></div><div class="line" style="width:88%"></div><div class="line" style="width:75%"></div><div class="line" style="width:40%"></div></div>
  </div>
  <iframe id="bar" title="bar"></iframe>
  <iframe id="menu" title="menu"></iframe>
  <svg id="pointer" viewBox="0 0 14 21" aria-hidden="true"><path d="M1 1v16.5l4-3.8 2.6 6 2.6-1.1-2.6-5.9h5.6z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg>
  <div id="log"></div>
  <script src="host.js"></script>
</body>
</html>
