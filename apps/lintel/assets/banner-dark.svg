<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560">
<title>Lintel</title>
<defs><radialGradient id="glow"><stop offset="0" stop-color="#6b86ea" stop-opacity="0.38"/><stop offset="1" stop-color="#6b86ea" stop-opacity="0"/></radialGradient></defs>
<ellipse cx="300" cy="280" rx="300" ry="250" fill="url(#glow)"/>
<g transform="translate(130,110) scale(0.332)">
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#212128"/>
      <stop offset="1" stop-color="#101014"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3987e5"/>
      <stop offset="1" stop-color="#9085e9"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <!-- the screen: a pane of glass -->
  <rect x="252" y="318" width="520" height="452" rx="34" fill="url(#glass)"/>
  <rect x="252" y="318" width="520" height="452" rx="34" fill="url(#sheen)"/>
  <!-- the beam's shadow on the glass -->
  <rect x="252" y="318" width="520" height="70" fill="url(#shade)"/>
  <!-- the lintel: the menu bar, wider than the opening it sits over -->
  <rect x="200" y="236" width="624" height="82" rx="24" fill="#f0efec"/>
  <g fill="#101014">
    <rect x="240" y="263" width="28" height="28" rx="8"/>
    <rect x="290" y="268" width="96" height="18" rx="9"/>
    <rect x="620" y="268" width="40" height="18" rx="9"/>
    <rect x="676" y="268" width="40" height="18" rx="9"/>
    <rect x="732" y="268" width="52" height="18" rx="9"/>
  </g>
</g>
