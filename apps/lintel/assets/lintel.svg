<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Lintel</title>
  <!-- Brick, which a lintel holds up over every doorway. -->
  <rect width="1024" height="1024" rx="224" fill="#b84d35"/>
  <!-- a lintel: the beam across the top of an opening, on its two jambs; on the beam, a menu bar -->
  <g fill="#f0efec">
    <rect x="184" y="248" width="656" height="116" rx="24"/>
    <rect x="268" y="364" width="64" height="420"/>
    <rect x="692" y="364" width="64" height="420"/>
    <rect x="300" y="364" width="424" height="420" fill-opacity="0.16"/>
  </g>
  <g fill="#b84d35">
    <rect x="228" y="286" width="40" height="40" rx="11"/>
    <rect x="290" y="295" width="132" height="22" rx="11"/>
    <rect x="610" y="295" width="52" height="22" rx="11"/>
    <rect x="680" y="295" width="52" height="22" rx="11"/>
    <rect x="750" y="295" width="46" height="22" rx="11"/>
  </g>
</svg>
