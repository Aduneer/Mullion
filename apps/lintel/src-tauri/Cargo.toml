[package]
name = "lintel"
version = "0.1.0"
description = "A macOS-style menu bar for Windows"
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same majors as Tauri's own dependencies (and Oriel's), so they're only compiled once.
windows = { version = "0.62", features = [
    "Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com",
    "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Networking_NetworkListManager", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem",
    "Media_Control", "Storage_Streams",
] }
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
