[package]
name = "lintel"
version = "0.5.0"
description = "A macOS-style menu bar for Windows"
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
mullion-core = { workspace = true, features = ["audio", "media", "pdh"] }
tauri = { workspace = true, features = [] }
tauri-plugin-autostart = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant",
    "Win32_Networking_NetworkListManager", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Devices_Display", "Win32_System_Power",
    "Win32_System_Registry", "Devices_Radios", "Devices_Bluetooth", "Devices_Enumeration", "Foundation_Collections",
] }
base64 = { workspace = true }
