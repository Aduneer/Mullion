name: Bug report
description: Something in one of Mullion's apps doesn't work, or works wrongly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. A quick search of the existing issues first saves us both a step.
        For a security problem, please use **Security → Report a vulnerability** instead, so it stays private.

  - type: dropdown
    id: app
    attributes:
      label: Which app
      options:
        - Oriel
        - Lintel
        - Fanlight
        - Mullion itself (its icon, settings or installer)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: At the bottom of the app's settings (in Oriel, press , on the dashboard; in Fanlight, Ctrl+, in the panel; in Lintel, Menu Bar Settings, in the logo menu).
      placeholder: "0.3.0"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How you run it
      options:
        - Mullion's installer
        - Mullion's portable zip
        - The app's own installer (setup.exe)
        - Portable zip
        - Built from source
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Settings → System → About, under Windows specifications.
      placeholder: "Windows 11 24H2"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: The steps, if you know them. "It happens after a few hours" helps too.

  - type: textarea
    id: extra
    attributes:
      label: Screenshots, hardware, anything else
      description: |
        Your screens and their scaling (100%, 150%…) help with layout problems; for a missing file in Fanlight, where it is and its name.
        Before you attach a screenshot, check it doesn't show anything private: file names, window titles, what you copied.
