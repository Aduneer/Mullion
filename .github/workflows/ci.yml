# Builds, lints and tests every push to main and every pull request, on Windows: the core and
# every app, as one workspace. Smart App Control can block freshly built test binaries on our own
# PCs, so this is where the tests reliably run. Changes to docs, images and the preview tools
# alone don't touch the Rust side, so they skip it. It can also be run by hand from the Actions tab.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**.md", "**/docs/**", "**/assets/**", "**/tools/**"]
  pull_request:
    paths-ignore: ["**.md", "**/docs/**", "**/assets/**", "**/tools/**"]

# A new push to a pull request stops its run that's still going.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Each app's ui/themes.css is a copy of ui-common/themes.css (its build.rs refreshes it);
      # a copy that was edited by hand, or not committed after a change, fails here.
      - name: Check the shared ui files
        shell: pwsh
        run: |
          $shared = Get-FileHash ui-common/themes.css
          $drift = Get-ChildItem apps/*/ui/themes.css | Where-Object { (Get-FileHash $_).Hash -ne $shared.Hash }
          if ($drift) { throw "Not the same as ui-common/themes.css: $($drift.FullName -join ', ')" }

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Test
        run: cargo test --workspace -- --nocapture

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
