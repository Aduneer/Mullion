[package]
name = "mullion-core"
version = "0.1.0"
description = "What Mullion's apps share: Win32 bindings, settings files, shell icons, the window list and its thumbnails, shortcuts, power and look"
license = "MIT"
edition = "2021"
publish = false

# Parts only some apps need, so the others don't compile them (or the windows crate's APIs for them).
[features]
audio = ["windows/Win32_Media_Audio", "windows/Win32_Media_Audio_Endpoints"]
media = ["windows/Foundation", "windows/Media_Control", "windows/Storage_Streams"]
net = ["windows/Foundation", "windows/Storage_Streams", "windows/Web_Http", "windows/Web_Http_Filters", "windows/Web_Http_Headers"]
pdh = []

[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant",
    "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem",
] }
base64 = { workspace = true }
